; PlatformIO Project Configuration File
;
; 三套硬件组合各一个 env，公共部分放 [common]，用 extends 复用：
;   ili9341-edge : ILI9341 240x320 彩屏 + 服务端 edge-tts(I2S/MAX98357A)   [默认]
;   st7735-edge  : ST7735 1.44" 128x128 彩屏 + edge-tts(I2S)
;   oled-lu6288  : SSD1306 128x64 OLED + 老 LU6288 UART 语音
;
; 切换：pio run -e st7735-edge   /   pio run -e oled-lu6288 -t upload -t monitor

[platformio]
default_envs = ili9341-edge

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_filters = esp32_exception_decoder, time
board_build.arduino.upstream_packages = no
; chain+ 会按 build_flags 里的 -DDISPLAY_DRIVER/-DTTS_ENGINE 评估 #if，
; 从而只为当前 env 拉取实际用到的库（OLED env 不拉 TFT_eSPI 等）。
lib_ldf_mode = chain+
lib_deps =
	adafruit/Adafruit BusIO@^1.16.1
	claws/BH1750@^1.3.0
	adafruit/Adafruit SHT31 Library@^2.2.2
	https://github.com/DFRobot/DFRobot_SHT3x.git
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DDEBUG_SERIAL=Serial

; ---- TFT 彩屏 + edge-tts 共用库 ----
[tft_edge_common]
extends = common
lib_deps =
	${common.lib_deps}
	bodmer/TFT_eSPI
	https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
	earlephilhower/ESP8266Audio@1.9.7
build_flags =
	${common.build_flags}
	-DTTS_ENGINE=0
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT
	-DTFT_MISO=-1
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=13
	-DTFT_RST=14
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=1
	-DLOAD_GLCD=1

[env:ili9341-edge]
extends = tft_edge_common
build_flags =
	${tft_edge_common.build_flags}
	-DDISPLAY_DRIVER=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

[env:st7735-edge]
extends = tft_edge_common
build_flags =
	${tft_edge_common.build_flags}
	-DDISPLAY_DRIVER=2
	-DST7735_DRIVER=1
	-DST7735_GREENTAB128
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=128
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000

; ---- 老组合：OLED + LU6288 ----
[env:oled-lu6288]
extends = common
lib_deps =
	${common.lib_deps}
	olikraus/U8g2@^2.34.3
build_flags =
	${common.build_flags}
	-DDISPLAY_DRIVER=0
	-DTTS_ENGINE=1
	-DU8G2_USE_ALL_FONTS
